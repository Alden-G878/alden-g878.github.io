# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

locale: "en-US"
title: Your awesome title
email: your-email@example.com
description: >- # this means to ignore newlines until "baseurl:"
  Write an awesome description for your new site here. You can edit this
  line in _config.yml. It will appear in your document head meta (for
  Google search results) and in your feed.xml site description.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://alden-g878.github.io" # the base hostname & protocol for your site
twitter_username: jekyllrb
github_username: alden-g878

# Minimal Mistakes theme settings
minimal_mistakes_skin: "default" # "default", "air", "aqua", "contrast", "dark", "dirt", "mint", "neon", "plum", "sunrise"

# Author profile shown in the sidebar
author:
  name: "Alden"
  avatar: # path of avatar image, e.g. "/assets/images/bio-photo.jpg"
  bio: # short bio shown under the avatar
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/alden-g878"

# Build settings
# Minimal Mistakes is not on the GitHub Pages theme whitelist, so it is
# loaded via remote_theme instead of `theme:`.
remote_theme: mmistakes/minimal-mistakes@4.28.1
plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap

# Minimal Mistakes defaults: enable search
search: true
lunr:
  search_within_pages: true

# Site pages live in _pages/
include:
  - _pages

# CV + portfolio content: one file per project / research entry.
# Add a file once -> it shows up on Portfolio, CV, and (if flagship) Home.
# `output: true` publishes each entry at /projects/<slug>/ and /research/<slug>/.
# Placeholder entries ship with `published: false` until the master CV is parsed.
collections:
  projects:
    output: true
    permalink: /:collection/:name/
    sort_by: date_end
  research:
    output: true
    permalink: /:collection/:name/
    sort_by: date_end

defaults:
  # all pages (about, archives, 404, etc.)
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      sidebar:
        nav: "main"
  # posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
  # personal / class projects
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      author_profile: false
      share: false
      read_time: false
  # research entries
  - scope:
      path: ""
      type: research
    values:
      layout: research
      author_profile: false
      share: false
      read_time: false

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
