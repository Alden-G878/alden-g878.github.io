# Build and deploy the site to GitHub Pages.
#
# This workflow is the second half of the LaTeX-CV work. The first half is
# cv/build.sh, which compiles cv/cv.tex into the two committed artifacts:
#
#   assets/pdf/Alden_CV.pdf    the downloadable / fidelity / ATS view (pdflatex)
#   _includes/cv-live.html    the in-page HTML view                (pandoc)
#
# CI runs that same script, so there is exactly one build path — a developer and
# a runner produce byte-identical HTML. The artifacts stay committed because
# native Pages cannot compile LaTeX or run pandoc, and because Jekyll's `include`
# tag raises IOError when a file is missing, which would break every local build.
#
# Ordering note: cv/build.sh MUST run before `jekyll build`, since _layouts/cv.html
# includes cv-live.html and Jekyll reads it at render time.
#
# See cv/BUILD.md for the build details and docs/build-performance-plan.md for why
# the toolchain image exists and how it is cached below.
#
# Action versions: major tags, refreshed deliberately. They are intentionally NOT
# pinned to SHAs, to stay consistent with how the rest of this repo tracks
# dependencies (the Gemfile uses `~>` constraints); revisit if a supply-chain
# policy is adopted.

name: Deploy site to Pages

on:
  # Deploys on every push to the default branch. There is no path filter: a
  # content-only change must still redeploy, and a cv/cv.tex change must too.
  push:
    branches: [main]

  # Manual re-run from the Actions tab — useful after flipping the Pages source
  # (Settings -> Pages -> Source) without having to push a dummy commit.
  workflow_dispatch:

# GITHUB_TOKEN scopes needed by the Pages deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and do NOT cancel an in-progress one: a cancelled
# deploy can leave the site on an older revision than the commit that triggered
# it. Queueing instead means the last push always wins eventually.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Reads the repo's Gemfile.lock (ruby 3.2 matches the local dev box).
      # bundler-cache restores ~/.bundle/cache; with BUNDLE_PATH unset, gems
      # install under the runner's default gem home, NOT the vendored
      # `vendor/bundle` path used locally — which is why `bundle exec` below
      # resolves against the CI install. The lockfile already lists
      # x86_64-linux, so no lockfile rewrite is needed.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # Warm the Docker layer cache for the CV toolchain image.
      #
      # cv/build.sh builds cv/Dockerfile on first use — TeX Live + pandoc +
      # poppler, ~45 s. Without this the runner rebuilds it from scratch on every
      # push, because GitHub-hosted runners are ephemeral. With type=gha the
      # layers are restored from the Actions cache, so a normal run only has to
      # execute the build steps (a few seconds) rather than download and install
      # a TeX distribution.
      #
      # `scope=` keys the cache per branch; `ignore-error=true` means a cache
      # miss or an outage degrades to a cold build instead of failing the deploy
      # — the build is correct either way, just slower once.
      #
      # This lives in the workflow rather than in cv/build.sh on purpose: the
      # script stays host-agnostic, and GHA cache semantics are GitHub-specific.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Ask cv/build.sh what tag it will look for, so the image cached below is
      # named identically. Hardcoding a tag here would make build.sh miss the
      # cached image and rebuild it from scratch, silently wasting the cache.
      - name: Resolve the CV toolchain image tag
        id: cv_image
        run: |
          chmod +x cv/build.sh
          echo "tag=$(./cv/build.sh --print-image-tag)" >> "$GITHUB_OUTPUT"

      - name: Build or restore the CV toolchain image
        uses: docker/build-push-action@v6
        with:
          context: cv/
          file: cv/Dockerfile
          # Load into the local daemon so cv/build.sh finds the image by tag and
          # skips its own build. `load` requires the default docker driver.
          load: true
          tags: ${{ steps.cv_image.outputs.tag }}
          cache-from: type=gha,scope=cv-tex
          cache-to: type=gha,mode=max,scope=cv-tex
          # type=gha needs an explicit provenance off: the cache exporter writes
          # attestations that the local docker daemon cannot load, which would
          # make the step fail after a successful build.
          provenance: false
          # A cache failure must not break the deploy; build.sh will build it.
          ignore-error: true

      # Compiles cv/cv.tex into BOTH artifacts, overwriting the committed copies.
      # Fails the job if pandoc emits no headings or if the PDF text layer is
      # broken — either the pdfTeX ligature signature or Unicode ligatures
      # (U+FB00-U+FB04), which the stricter check now also rejects.
      - name: Regenerate CV artifacts (pdfTeX + pandoc)
        run: |
          chmod +x cv/build.sh
          ./cv/build.sh

      # Both committed artifacts must match what cv/cv.tex produces. This is
      # checkable because BOTH are now byte-reproducible:
      #
      #   _includes/cv-live.html    pandoc output is deterministic by nature.
      #   assets/pdf/Alden_CV.pdf   pdflatex would otherwise stamp the current
      #                             time into CreationDate/ModDate on every run,
      #                             but cv/build.sh pins SOURCE_DATE_EPOCH, so
      #                             identical input gives identical bytes. That
      #                             is what makes checking the PDF possible at
      #                             all — before, a byte comparison would have
      #                             been permanently red and the PDF was
      #                             therefore excluded from this check.
      #
      # `git status --porcelain` rather than `git diff --quiet`: diff compares
      # the index against the worktree and is blind to untracked files, so it
      # would pass for an artifact that was regenerated but never `git add`ed.
      # Porcelain reports "??" for untracked, " M" for modified and " D" for
      # deleted, covering all three failure modes with one condition.
      - name: Check for CV drift
        run: |
          status="$(git status --porcelain -- _includes/cv-live.html assets/pdf/Alden_CV.pdf)"
          if [ -n "$status" ]; then
            echo "::error::The committed CV artifacts are out of date with cv/cv.tex."
            {
              echo
              echo "cv/build.sh regenerated the artifacts and at least one does not"
              echo "match the committed copy, which means cv/cv.tex was edited without"
              echo "re-running the build (or the result was never committed)."
              echo
              echo "git status says:"
              echo "$status"
              echo
              echo "Fix locally with:  ./cv/build.sh"
              echo "Then commit cv/cv.tex together with _includes/cv-live.html and"
              echo "assets/pdf/Alden_CV.pdf."
            } >&2
            exit 1
          fi
          echo "ok: _includes/cv-live.html and assets/pdf/Alden_CV.pdf match cv/cv.tex"

      # Renders with the lockfile toolchain — Jekyll 4.4.1 / kramdown 2.5.1 /
      # rouge 4.5.1, which is NOT what native Pages used (3.10.0 / 2.4.0 /
      # 3.30.0). That engine change is the one side effect of this workflow that
      # can alter pages nobody touched; it was diffed and accepted before the
      # source switch (plan §6.1).
      #
      # base_path is "" for a user site (alden-g878.github.io) and set for a
      # project site, so passing it through keeps the workflow reusable as-is.
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # Guards the deployed output rather than the repo: these are the two
      # failures that would otherwise ship silently. `/cv/` must exist, and no
      # LaTeX source may reach the web root — cv/ is in _config.yml's exclude,
      # so a regression there would be a real leak of the .tex master.
      - name: Sanity-check the built site
        run: |
          test -f _site/cv/index.html || {
            echo "::error::_site/cv/index.html is missing — the CV page did not build."
            exit 1
          }
          leaks="$(find _site -name '*.tex' -o -name '*.aux' -o -name 'BUILD.md' 2>/dev/null || true)"
          if [ -n "$leaks" ]; then
            echo "::error::LaTeX sources or build notes leaked into _site:"
            echo "$leaks" >&2
            exit 1
          fi
          if ! grep -q "cv-doc" _site/cv/index.html; then
            echo "::error::/cv/ built without the HTML document pane."
            exit 1
          fi
          echo "ok: _site/cv/index.html present, no source leakage, HTML pane rendered"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
